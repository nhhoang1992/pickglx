# /etc/nginx/sites-available/phukienhatde.vn.conf
# Sau khi sửa: sudo ln -s /etc/nginx/sites-available/phukienhatde.vn.conf /etc/nginx/sites-enabled/
#              sudo nginx -t && sudo systemctl reload nginx

# Redirect www -> apex
server {
    listen 80;
    listen [::]:80;
    server_name www.phukienhatde.vn;
    return 301 https://phukienhatde.vn$request_uri;
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name phukienhatde.vn api.phukienhatde.vn;

    # Let's Encrypt webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Frontend (Next.js)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name phukienhatde.vn;

    ssl_certificate     /etc/letsencrypt/live/phukienhatde.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phukienhatde.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Reverse proxy to Next.js
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Static assets cache
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000/_next/static/;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# Backend API
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.phukienhatde.vn;

    ssl_certificate     /etc/letsencrypt/live/api.phukienhatde.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.phukienhatde.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # CORS handled by FastAPI, but add fallback
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
