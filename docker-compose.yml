version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pickglx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pickglx
      POSTGRES_USER: pickglx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    container_name: pickglx-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pickglx-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://pickglx:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/pickglx
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    ports:
      - "127.0.0.1:8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.phukienhatde.vn/api/v1
    container_name: pickglx-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://api.phukienhatde.vn/api/v1
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
  redis_data:
